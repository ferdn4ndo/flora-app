<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Flora — Something went wrong</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --flora-paper: #fdfdfb;
        --flora-cream: #f7f9f6;
        --flora-ink: #1c2e28;
        --flora-ink-muted: #5c6f68;
        --flora-border: #dfe8e2;
        --flora-sky: #0ea5e9;
        --flora-shadow: 0 1px 2px rgba(28, 46, 40, 0.06), 0 8px 24px rgba(28, 46, 40, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --flora-paper: #0f1412;
          --flora-cream: #141a18;
          --flora-ink: #e8f0ec;
          --flora-ink-muted: #9fb0a8;
          --flora-border: #2a3532;
          --flora-sky: #38bdf8;
          --flora-shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.45);
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family:
          'DM Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 15px;
        line-height: 1.55;
        color: var(--flora-ink);
        background: var(--flora-paper);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 1.75rem 1.5rem;
        background: var(--flora-cream);
        border: 1px solid var(--flora-border);
        border-radius: 12px;
        box-shadow: var(--flora-shadow);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--flora-ink-muted);
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        padding: 0.55rem 1.1rem;
        font-weight: 600;
        font-size: 0.9rem;
        color: #fff;
        text-decoration: none;
        background: var(--flora-sky);
        border-radius: 8px;
      }
      a:hover {
        filter: brightness(1.05);
      }
      a:focus-visible {
        outline: 2px solid var(--flora-sky);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Something went wrong</h1>
      <p>
        This page is shown when the app or storage gateway could not serve your request. You can
        return to the start and try again.
      </p>
      <a href="./index.html">Back to Flora</a>
    </main>
  </body>
</html>
